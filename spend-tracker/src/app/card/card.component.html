<div style="display: flex; flex-direction: row;">
  <mat-card class="card mat-elevation-z5" style="flex-grow: 1;">
    <mat-card-header>
      <mat-card-title>{{ heading }}</mat-card-title>
    </mat-card-header>
    <button mat-raised-button color="primary" (click)="openDialog()">
      Add
    </button>
    <mat-card-content class="card-content" style="width: 100%">
      <app-records [fields]="fields" #recordComp></app-records>
    </mat-card-content>
  </mat-card>
  <div style="width: 50vh; height: 50vh;">
    <app-chart></app-chart>
  </div>
</div>
